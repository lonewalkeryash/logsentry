[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "logsentry"
version = "0.2.0"
description = "Log threat detection and response: flag attacks in auth, web and Windows logs (mapped to MITRE ATT&CK), follow logs live, and auto-block attacker IPs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yashas S Reddy" }]
dependencies = ["PyYAML>=6.0"]
keywords = ["security", "blue-team", "detection", "siem", "mitre-attack", "log-analysis", "intrusion-prevention", "fail2ban", "firewall"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/lonewalkeryash/logsentry"
Repository = "https://github.com/lonewalkeryash/logsentry"
Issues = "https://github.com/lonewalkeryash/logsentry/issues"
Changelog = "https://github.com/lonewalkeryash/logsentry/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
logsentry = "logsentry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
logsentry = ["rules/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
