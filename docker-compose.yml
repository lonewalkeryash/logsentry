# Live SSH protection on a Linux host:
#   docker compose up -d        # preview mode: logs what it would block
# To enforce blocks, add "--apply" to the command below and restart.
services:
  logsentry:
    build: .
    image: logsentry:latest
    command: ["watch", "/host/log/auth.log", "--format", "auth", "--block", "--firewall", "iptables"]
    user: root                    # needed to change the host firewall
    network_mode: host            # share the host's network namespace (and its iptables)
    cap_add: [NET_ADMIN, NET_RAW]
    volumes:
      - /var/log:/host/log:ro     # mount the directory, not the file, so log rotation is seen
      - logsentry-state:/var/lib/logsentry
    restart: unless-stopped

volumes:
  logsentry-state:
