name: Bug report
description: Something crashes or behaves differently from the documentation
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: For a vulnerability in LogSentry itself, do not open an issue. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran and its output
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LogSentry version
      description: Output of `logsentry --version`
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system, Python version and install method
      placeholder: Ubuntu 24.04, Python 3.12, pipx
